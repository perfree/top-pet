name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/$RELEASE_TAG.md"
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in panel-pet@local/*.js tools/shell-test@local/*.js; do node --check "$file"; done
      - run: python3 tools/build.py
      - run: python3 tools/verify-build.py
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/panel-pet@local.shell-extension.zip \
            dist/top-pet-preview.html \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Top Pet $RELEASE_TAG · 卡皮顶栏小伙伴" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
