name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in panel-pet@local/*.js tools/shell-test@local/*.js; do node --check "$file"; done
      - run: python3 tools/build.py
      - run: python3 tools/verify-build.py
